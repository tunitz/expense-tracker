services:
  expense-tracker:
    build: .
    container_name: expense-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-3020}:3020"
    environment:
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - expense-data:/data

volumes:
  expense-data: {}

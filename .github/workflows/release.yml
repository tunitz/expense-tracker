name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump override
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  version:
    name: Auto-Version & Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.calc.outputs.released }}
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Compute next SemVer tag and create release
        id: calc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP_OVERRIDE: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail

          EXISTING_TAG="$(git tag --points-at HEAD 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1 || true)"
          if [ -n "${EXISTING_TAG}" ]; then
            echo "HEAD is already tagged with ${EXISTING_TAG}; skipping release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          export LAST_TAG

          NEXT_VERSION="$(bun -e '
            import { readFileSync } from "node:fs";
            const lastTag = process.env.LAST_TAG?.trim() ?? "";
            const override = process.env.BUMP_OVERRIDE?.trim() ?? "auto";

            function bump(ver, level) {
              const parts = ver.replace(/^v/, "").split(".").map((n) => parseInt(n, 10));
              let [maj = 0, min = 1, pat = 0] = parts;
              if (level === "major") return `${maj + 1}.0.0`;
              if (level === "minor") return `${maj}.${min + 1}.0`;
              return `${maj}.${min}.${pat + 1}`;
            }

            if (!lastTag) {
              const pkg = JSON.parse(readFileSync("package.json", "utf8"));
              const base = typeof pkg.version === "string" && /^\d+\.\d+\.\d+$/.test(pkg.version) ? pkg.version : "0.1.0";
              console.log(override === "auto" ? base : bump(base, override));
              process.exit(0);
            }

            let level = override;
            if (level === "auto") {
              const proc = Bun.spawnSync(["git", "log", "--format=%B%x1e", `${lastTag}..HEAD`]);
              const raw = new TextDecoder().decode(proc.stdout);
              const commits = raw.split("\x1e").map((s) => s.trim()).filter(Boolean);
              level = "patch";
              for (const msg of commits) {
                const subject = msg.split("\n")[0] ?? "";
                if (/^[a-z]+(\([^)]+\))?!:/.test(subject) || /\bBREAKING CHANGE:/.test(msg)) {
                  level = "major";
                  break;
                }
                if (/^feat(\([^)]+\))?:/.test(subject)) {
                  level = "minor";
                }
              }
            }

            console.log(bump(lastTag, level));
          ')"

          TAG="v${NEXT_VERSION}"
          echo "Creating tag ${TAG} (previous: ${LAST_TAG:-none})"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & Publish Multi-Arch GHCR Image
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase repository name
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.lower }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.repo.outputs.lower }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

[package]
name = "statement-cp037"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "CP037 text decoding for statement PDFs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "3"
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
